<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

<!--tarjeta personalizada de inicio-->
    <!-- Loading overlay -->
    <div id="site-loader" class="site-loader" style="display:flex">
        <div class="spinner"></div>
    </div>
<div class="container">
    <form id="loginForm">
        <h1>Iniciar Sesión🐾</h1>
        <p>Utiliza su correo para Iniciar Sesión<p></p>
        <input id="correo" type="email" placeholder="Correo" autocomplete="email" required>
        <br><br>
        <p>Utiliza su contraseña para Iniciar Sesión<p></p>
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <br><br>

        <p id="loginError" class="auth-error" role="alert" hidden></p>
        <button id="loginBtn" type="submit">Entrar</button>
        <br>
        <a class="btn_register" href="auth/registro.html">registrarte</a>


    </form>
</div>

<script type="module" src="auth/login.js"></script>

<script>
    (function(){
        const loader = document.getElementById('site-loader');
        if(!loader) return;
        function hide(){ loader.style.display = 'none'; }
        function show(){ loader.style.display = 'flex'; }
        window.addEventListener('DOMContentLoaded', hide);
        window.addEventListener('load', hide);
        window.addEventListener('beforeunload', show);
        document.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', e => {
                const href = a.getAttribute('href');
                if(!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
                if(a.target && a.target !== '' && a.target !== '_self') return;
                e.preventDefault();
                show();
                setTimeout(()=> window.location.href = href, 120);
            });
        });
    })();
</script>

</body>
</html>
