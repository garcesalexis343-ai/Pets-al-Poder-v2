<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="comunidad.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil | Pets al Poder</title>
</head>
<body class="profile-page">
<div id="site-loader" class="site-loader" style="display:flex">
    <div class="spinner"></div>
</div>

<header class="profile-header">
    <h1 id="perfil-titulo">Mi Perfil</h1>
    <a class="profile-back" href="../inicio.html">Regresar</a>
</header>

<main class="container-comunidad profile-layout">
    <section class="feed" id="mis-publicaciones">
        <div id="sin-publicaciones">
            <h2>No tienes publicaciones aún</h2>
        </div>
    </section>

    <aside class="sidebar profile-sidebar">
        <h2>Tu información</h2>
        <div id="perfil-info" class="profile-info"></div>
        <h3 class="profile-about-title">Sobre mí</h3>
        <p id="perfil-description" class="profile-description"></p>
        <button id="editar-descripcion" class="profile-edit-button" type="button" hidden>Añadir descripción</button>
        <div id="editor-descripcion" class="profile-description-editor" hidden>
            <label for="texto-descripcion">Tu descripción</label>
            <textarea id="texto-descripcion" maxlength="500" placeholder="Cuéntales a los demás un poco sobre ti"></textarea>
            <div class="profile-description-actions">
                <button id="cancelar-descripcion" class="profile-cancel-button" type="button">Cancelar</button>
                <button id="guardar-descripcion" class="profile-save-button" type="button">Guardar</button>
            </div>
        </div>
    </aside>
</main>

<button class="flotante" id="abrirModal" style="display:block !important; position:fixed; right:25px; bottom:25px; z-index:1000;">+</button>

<div class="modal" id="modal">
    <div class="modal-contenido">
        <button id="cerrarModal">✖</button>
        <h2>Nueva publicación</h2>

        <input
            type="text"
            id="titulo"
            placeholder="Título de la publicación">

        <input
            type="file"
            id="foto"
            accept="image/*">

        <textarea
            id="descripcion"
            placeholder="Describe lo sucedido"></textarea>

        <button
            class="publicar"
            id="publicar">
            Publicar
        </button>

    </div>
</div>

<script type="module" src="perfil.js"></script>
</body>
</html>
